[tox]
envlist =
    clean,
    check,
    py310, py311, py312, py313, py314, py315

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315

[testenv]
basepython =
    py: python3
    pypy: {env:TOXPYTHON:pypy}
    py310: {env:TOXPYTHON:python3.10}
    py311: {env:TOXPYTHON:python3.11}
    py312: {env:TOXPYTHON:python3.12}
    py313: {env:TOXPYTHON:python3.13}
    py314: {env:TOXPYTHON:python3.14}
    py315: {env:TOXPYTHON:python3.15}
    {lxml_support,spell,docs,check,coverage,report,clean}: python3
setenv =
    PYTHONPATH={toxinidir}/tests
    PYTHONUNBUFFERED=yes
passenv =
    *
deps =
    pytest
    pytest-cov
    setuptools_scm
    coverage
commands =
    pytest --cov=mlx --cov-report=term-missing -vv tests/
    mlx-warnings -h
    mlx-warnings --version
    python -c 'import mlx.warnings;print(mlx.warnings.__version__)'
    python -m mlx.warnings -h
    python -m mlx.warnings --version
    python -m mlx.warnings -j --maxwarnings 3 --minwarnings 3 tests/test_in/junit*.xml
    python -m mlx.warnings -j --maxwarnings 3 --minwarnings 3 "tests/test_in/junit*.xml"  #emulate for windows (no shell expansion)
    python -m mlx.warnings -j --command --maxwarnings 2 --minwarnings 2 cat tests/test_in/junit_double_fail.xml

[testenv:lxml_support]
deps =
    pytest
    lxml
commands =
    pytest -vv tests/

[testenv:spell]
setenv =
    SPELLCHECK=1
commands =
    sphinx-build -b spelling docs docs/_build
skip_install = true
deps =
    -r{toxinidir}/docs/requirements.txt
    sphinxcontrib-spelling
    pyenchant

[testenv:docs]
deps =
    -r{toxinidir}/docs/requirements.txt
commands =
    sphinx-build {posargs:-E} -b doctest docs docs/_build
    sphinx-build {posargs:-E} -b html docs docs/_build

[testenv:docs_linkcheck]
deps =
    -r{toxinidir}/docs/requirements.txt
commands =
    sphinx-build -b linkcheck docs docs/_build

[testenv:check]
deps =
    docutils
    twine >= 6.0.1
    build
    readme-renderer
    flake8
    pygments
    check-manifest
skip_install = true
commands =
    python -m build
    twine check dist/*
    check-manifest {toxinidir}
    flake8 src tests

[testenv:coverage]
deps =
    coverage
skip_install = true
commands =
    coverage xml --ignore-errors

[testenv:report]
deps = coverage
skip_install = true
commands =
    coverage report
    coverage html

[testenv:clean]
commands = coverage erase
skip_install = true
deps = coverage
